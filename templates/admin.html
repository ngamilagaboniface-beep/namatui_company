<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Namatui Admin | Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-slate-50 p-6">
    <div class="container mx-auto">
        <div class="flex justify-between items-center mb-10 bg-black text-white p-8 rounded-3xl shadow-2xl border-b-4 border-orange-500">
            <h1 class="text-2xl font-black uppercase italic tracking-tighter">Namatui Dashboard</h1>
            <div class="flex gap-6">
                <a href="/" class="text-[10px] font-bold text-slate-400 hover:text-white uppercase transition">Website</a>
                <a href="/logout" class="text-[10px] font-bold text-red-400 uppercase transition">Logout</a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-black mb-8 border-b pb-4 uppercase">Your Properties</h2>
                <div class="space-y-4">
                    {% for p in properties %}
                    <div class="p-6 bg-slate-50 rounded-2xl flex justify-between items-center group border border-transparent hover:border-orange-200 transition">
                        <div>
                            <span class="text-[8px] font-bold uppercase px-2 py-1 rounded {{ 'bg-green-100 text-green-600' if p.status == 'Available' else 'bg-red-100 text-red-600' }} mb-2 inline-block">
                                {{ p.status }}
                            </span>
                            <p class="font-black text-sm text-black uppercase">{{ p.title }}</p>
                            <p class="text-[10px] font-bold text-slate-400">{{ p.location }} | {{ "{:,.0f}".format(p.price) }} TZS</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editProperty({{ p|tojson }})" class="bg-black text-white p-3 rounded-lg hover:bg-orange-500 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                            </button>
                            <form action="/admin/delete/{{ p.id }}" method="POST">
                                <button class="bg-red-50 text-red-500 p-3 rounded-lg hover:bg-red-500 hover:text-white transition">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div id="form-container" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 h-fit sticky top-6">
                <h2 id="form-title" class="text-xl font-black mb-8 border-b pb-4 uppercase">Add Listing</h2>
                <form action="/admin/save" method="POST" class="space-y-4">
                    <input type="hidden" name="property_id" id="property_id">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[9px] font-black uppercase text-slate-400">Title</label>
                            <input type="text" name="title" id="title" required class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm border focus:border-orange-400">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-black uppercase text-slate-400">Area</label>
                            <input type="text" name="location" id="location" required class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm border focus:border-orange-400">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[9px] font-black uppercase text-slate-400">Type</label>
                            <input type="text" name="type" id="type" placeholder="e.g. Residential Plot" required class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm border focus:border-orange-400">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-black uppercase text-slate-400">Price (TZS)</label>
                            <input type="number" name="price" id="price" required class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm border focus:border-orange-400">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase text-slate-400">Status</label>
                        <select name="status" id="status" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm border focus:border-orange-400">
                            <option value="Available">Available</option>
                            <option value="Sold">Sold</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase text-slate-400">Image Link</label>
                        <input type="text" name="image_url" id="image_url" required class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm border focus:border-orange-400">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[9px] font-black uppercase text-slate-400">Details</label>
                        <textarea name="features" id="features" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold text-sm h-24 border focus:border-orange-400"></textarea>
                    </div>
                    
                    <button id="submit-btn" class="w-full bg-black text-white py-4 rounded-xl font-black uppercase text-[10px] hover:bg-orange-500 shadow-xl transition">Publish Property</button>
                    <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden w-full text-slate-400 font-bold uppercase text-[9px] mt-2">Cancel Edit</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function editProperty(p) {
            document.getElementById('form-title').innerText = "Update Listing";
            document.getElementById('submit-btn').innerText = "Save Changes";
            document.getElementById('cancel-btn').classList.remove('hidden');
            
            document.getElementById('property_id').value = p.id;
            document.getElementById('title').value = p.title;
            document.getElementById('location').value = p.location;
            document.getElementById('type').value = p.property_type;
            document.getElementById('price').value = p.price;
            document.getElementById('status').value = p.status;
            document.getElementById('image_url').value = p.image_url;
            document.getElementById('features').value = p.features;

            window.scrollTo({ top: document.getElementById('form-container').offsetTop - 50, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('form-title').innerText = "Add Listing";
            document.getElementById('submit-btn').innerText = "Publish Property";
            document.getElementById('cancel-btn').classList.add('hidden');
            document.getElementById('property_id').value = "";
            document.querySelector('form').reset();
        }
    </script>
</body>
</html>
